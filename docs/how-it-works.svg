<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="430" rx="18" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1e">How GearBattery finds your batteries</text>

  <!-- sources -->
  <g font-size="14">
    <rect x="30" y="70" width="270" height="62" rx="10" fill="#f6f5f3" stroke="#dcdcda"/>
    <text x="46" y="96" fill="#1c1c1e" font-weight="700">Logitech HID++</text>
    <text x="46" y="117" fill="#6b6b70" font-size="12.5">Lightspeed · Unifying · Bolt · USB · BLE</text>

    <rect x="30" y="148" width="270" height="62" rx="10" fill="#f6f5f3" stroke="#dcdcda"/>
    <text x="46" y="174" fill="#1c1c1e" font-weight="700">IORegistry</text>
    <text x="46" y="195" fill="#6b6b70" font-size="12.5">BatteryPercent (Magic &amp; Bluetooth HID)</text>

    <rect x="30" y="226" width="270" height="62" rx="10" fill="#f6f5f3" stroke="#dcdcda"/>
    <text x="46" y="252" fill="#1c1c1e" font-weight="700">Bluetooth report</text>
    <text x="46" y="273" fill="#6b6b70" font-size="12.5">AirPods L/R/case · headphones</text>

    <rect x="30" y="304" width="270" height="62" rx="10" fill="#f6f5f3" stroke="#dcdcda"/>
    <text x="46" y="330" fill="#1c1c1e" font-weight="700">GameController</text>
    <text x="46" y="351" fill="#6b6b70" font-size="12.5">PlayStation · Xbox · Switch Pro</text>
  </g>

  <!-- arrows -->
  <g stroke="#a1a1a6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M300 101 C 350 101, 350 218, 380 218"/>
    <path d="M300 179 C 340 179, 350 218, 380 218"/>
    <path d="M300 257 C 340 257, 350 218, 380 218"/>
    <path d="M300 335 C 350 335, 350 218, 380 218"/>
    <path d="M610 218 L 650 218"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a6"/></marker></defs>

  <!-- monitor -->
  <rect x="385" y="150" width="225" height="136" rx="12" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="497" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1e">Battery monitor</text>
  <text x="497" y="205" text-anchor="middle" font-size="12.5" fill="#6b6b70">merge &amp; de-duplicate</text>
  <text x="497" y="225" text-anchor="middle" font-size="12.5" fill="#6b6b70">remember last level</text>
  <text x="497" y="245" text-anchor="middle" font-size="12.5" fill="#6b6b70">low-battery alerts</text>
  <text x="497" y="268" text-anchor="middle" font-size="11.5" fill="#6b6b70" font-family="Menlo, monospace">1 tick / min · 20 s tolerance</text>

  <!-- menu bar -->
  <rect x="655" y="190" width="215" height="56" rx="10" fill="#f6f5f3" stroke="#dcdcda"/>
  <text x="762" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">mouse 46%  ·  keys 80%</text>
  <text x="762" y="272" text-anchor="middle" font-size="12.5" fill="#6b6b70">menu bar, 24/7</text>

  <!-- events -->
  <text x="450" y="395" text-anchor="middle" font-size="13" fill="#6b6b70">Events, not polling: USB / Bluetooth hotplug, receiver "mouse woke up" notices,</text>
  <text x="450" y="413" text-anchor="middle" font-size="13" fill="#6b6b70">battery broadcasts and Mac wake-from-sleep all trigger an instant read.</text>
</svg>
